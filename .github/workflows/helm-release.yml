name: Helm chart release

on:
  push:
    tags:
      - "chart-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v3.17.3
  CHART_DIR: charts/gofer

jobs:
  release:
    name: Package and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check tag matches Chart.yaml version
        if: startsWith(github.ref, 'refs/tags/chart-v')
        run: |
          tag="${GITHUB_REF_NAME#chart-v}"
          chart="$(awk '/^version:/ {print $2}' "${CHART_DIR}/Chart.yaml")"
          if [ "${tag}" != "${chart}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${chart}"
            exit 1
          fi

      - name: Lint
        run: helm lint "${CHART_DIR}" --strict

      - name: Package
        run: helm package "${CHART_DIR}" --destination "${RUNNER_TEMP}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          pkg="$(ls "${RUNNER_TEMP}"/gofer-*.tgz)"
          helm push "${pkg}" "oci://ghcr.io/${owner}/charts"
