{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gofer.fullname" . }}
  labels:
    {{- include "gofer.labels" . | nindent 4 }}
type: Opaque
stringData:
  GOFER_SECRET_KEY: {{ required "secret.secretKey is required (64 hex chars), or set secret.existingSecret" .Values.secret.secretKey | quote }}
  {{- with .Values.secret.setupToken }}
  GOFER_SETUP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
